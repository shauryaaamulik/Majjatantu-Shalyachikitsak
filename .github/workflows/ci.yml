name: tests
on: [push, pull_request]
jobs:
  synthetic:
    # Torch-free subset: planted-defect testbed, budgets, edit log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pydantic pyyaml pytest
      - run: python -m pytest -q tests/test_synthetic.py
      - run: python experiments/synthetic_failures/run.py --seeds 5
