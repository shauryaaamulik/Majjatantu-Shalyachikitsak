[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "majjatantu"
version = "0.1.0"
description = "Autonomous neural-network debugging, causal interpretability and weight-space repair"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
authors = [{ name = "shauryaaamulik" }]
keywords = [
  "mechanistic-interpretability",
  "weight-space-programming",
  "model-editing",
  "causal-inference",
]
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "safetensors>=0.4.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]
interpretability = [
  "transformer-lens>=2.0.0",
  "nnsight>=0.3.0",
]
tracking = [
  "mlflow>=2.10.0",
]
all = ["majjatantu[dev,interpretability,tracking]"]

[project.scripts]
majjatantu = "majjatantu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/majjatantu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
